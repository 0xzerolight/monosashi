[project]
name = "monosashi"
version = "0.1.0"
description = "A yardstick for Japanese tokenizers, measured the way learner tools use them"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "data/LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
monosashi = "monosashi.cli:main"

[dependency-groups]
adapters = [
    "fugashi>=1.5.2",
    "sudachidict-full>=20261015",
    "sudachipy>=0.7.0",
    "unidic-lite>=1.0.8",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monosashi"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
# Vendored from anki_miner (a Yomitan port); kept byte-identical to upstream
# so a re-vendor is a plain copy.
extend-exclude = ["src/monosashi/deinflect/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Japanese text is the subject matter: fullwidth and look-alike characters are intended.
# E501: the formatter owns line length, and ruff counts Japanese characters double-width.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["monosashi.deinflect._vendor.*"]
ignore_errors = true

# Light-adapter tools live in the optional `adapters` group, absent in CI.
[[tool.mypy.overrides]]
module = ["fugashi", "sudachipy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
